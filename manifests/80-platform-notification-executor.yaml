apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-notification-executor
  namespace: directus
---
apiVersion: batch/v1
kind: Job
metadata:
  name: platform-notification-executor-secret-bootstrap
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Force=true
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        linkerd.io/inject: "disabled"
    spec:
      serviceAccountName: directus
      restartPolicy: Never
      volumes:
        - name: vault-root-token
          secret:
            secretName: vault-root-token
      containers:
        - name: bootstrap
          image: alpine/k8s:1.31.4
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: vault-root-token
              mountPath: /vault-token
              readOnly: true
          command:
            - /bin/sh
            - -ec
          args:
            - |
              apk add --no-cache curl jq openssl >/dev/null

              VAULT_ADDR="http://vault.vault.svc.cluster.local:8200"
              VAULT_TOKEN="$(cat /vault-token/VAULT_TOKEN)"
              VAPID_SECRET_PATH="secret/data/platform-notification/browser-push/vapid"
              VAPID_SUBJECT="mailto:platform-notifications@dotcomrow.com"

              cat >/tmp/platform-notification-executor-policy.hcl <<EOF
              path "secret/data/platform-notification-service" {
                capabilities = ["read"]
              }

              path "secret/data/platform-notification/browser-push/vapid" {
                capabilities = ["read"]
              }
              EOF

              policy_payload="$(jq -Rs '{policy:.}' /tmp/platform-notification-executor-policy.hcl)"
              policy_code="$(curl -sS -o /tmp/policy-write.json -w '%{http_code}' \
                -X PUT \
                -H "X-Vault-Token: ${VAULT_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${policy_payload}" \
                "${VAULT_ADDR}/v1/sys/policies/acl/platform-notification-executor" || true)"
              if [ "${policy_code}" != "200" ] && [ "${policy_code}" != "204" ]; then
                echo "Failed to write platform-notification-executor Vault policy (HTTP ${policy_code})."
                cat /tmp/policy-write.json || true
                exit 1
              fi

              role_payload="$(jq -nc '{
                bound_service_account_names:["platform-notification-executor"],
                bound_service_account_namespaces:["directus"],
                token_policies:["platform-notification-executor"],
                token_ttl:"24h"
              }')"
              role_code="$(curl -sS -o /tmp/role-write.json -w '%{http_code}' \
                -X POST \
                -H "X-Vault-Token: ${VAULT_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${role_payload}" \
                "${VAULT_ADDR}/v1/auth/kubernetes/role/platform-notification-executor" || true)"
              if [ "${role_code}" != "200" ] && [ "${role_code}" != "204" ]; then
                echo "Failed to write platform-notification-executor Vault Kubernetes auth role (HTTP ${role_code})."
                cat /tmp/role-write.json || true
                exit 1
              fi

              vapid_code="$(curl -sS -o /tmp/vapid-secret.json -w '%{http_code}' \
                -H "X-Vault-Token: ${VAULT_TOKEN}" \
                "${VAULT_ADDR}/v1/${VAPID_SECRET_PATH}" || true)"
              if [ "${vapid_code}" = "200" ]; then
                existing_vapid_data="$(jq -c '.data.data // {}' /tmp/vapid-secret.json)"
                vapid_subject="$(jq -r '.data.data.subject // empty' /tmp/vapid-secret.json)"
                vapid_public_key="$(jq -r '.data.data.public_key // empty' /tmp/vapid-secret.json)"
                vapid_private_key="$(jq -r '.data.data.private_key // empty' /tmp/vapid-secret.json)"
              elif [ "${vapid_code}" = "404" ]; then
                existing_vapid_data="{}"
                vapid_subject=""
                vapid_public_key=""
                vapid_private_key=""
              else
                echo "Failed to read ${VAPID_SECRET_PATH} from Vault (HTTP ${vapid_code})."
                cat /tmp/vapid-secret.json || true
                exit 1
              fi

              if [ -z "${vapid_subject}" ] || [ "${vapid_subject}" = "null" ]; then
                vapid_subject="${VAPID_SUBJECT}"
              fi

              if [ -z "${vapid_public_key}" ] || [ "${vapid_public_key}" = "null" ] || [ -z "${vapid_private_key}" ] || [ "${vapid_private_key}" = "null" ]; then
                openssl ecparam -name prime256v1 -genkey -noout -out /tmp/vapid-private.pem
                private_key_offset="$(openssl asn1parse -in /tmp/vapid-private.pem \
                  | awk -F: '/prim: OCTET STRING/{gsub(/ /, "", $1); print $1; exit}')"
                openssl asn1parse -in /tmp/vapid-private.pem -strparse "${private_key_offset}" -out /tmp/vapid-private.raw -noout
                vapid_private_key="$(openssl base64 -A < /tmp/vapid-private.raw | tr '+/' '-_' | tr -d '=')"
                vapid_public_key="$(openssl ec -in /tmp/vapid-private.pem -pubout -outform DER 2>/dev/null \
                  | tail -c 65 \
                  | openssl base64 -A \
                  | tr '+/' '-_' \
                  | tr -d '=')"
              fi

              if [ -z "${vapid_public_key}" ] || [ -z "${vapid_private_key}" ]; then
                echo "Failed to generate browser push VAPID keypair."
                exit 1
              fi

              vapid_payload="$(jq -nc \
                --arg subject "${vapid_subject}" \
                --arg public_key "${vapid_public_key}" \
                --arg private_key "${vapid_private_key}" \
                --argjson existing "${existing_vapid_data}" \
                '{data:($existing + {subject:$subject, public_key:$public_key, private_key:$private_key})}')"
              vapid_write_code="$(curl -sS -o /tmp/vapid-secret-write.json -w '%{http_code}' \
                -X POST \
                -H "X-Vault-Token: ${VAULT_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "${vapid_payload}" \
                "${VAULT_ADDR}/v1/${VAPID_SECRET_PATH}" || true)"
              if [ "${vapid_write_code}" != "200" ] && [ "${vapid_write_code}" != "204" ]; then
                echo "Failed to write ${VAPID_SECRET_PATH} to Vault (HTTP ${vapid_write_code})."
                cat /tmp/vapid-secret-write.json || true
                exit 1
              fi

              echo "Platform notification executor Vault configuration is ready."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config-platform-notification-executor
  namespace: directus
data:
  vault-agent.hcl: |
    pid_file = "/vault/agent.pid"
    exit_after_auth = false

    vault {
      address = "http://vault.vault.svc.cluster.local:8200"
    }

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "platform-notification-executor"
        }
      }

      sink "file" {
        config = {
          path = "/vault-secrets/vault-token"
          mode = 0644
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-notification-executor
  namespace: directus
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    reloader.stakater.com/auto: "true"
  labels:
    app: platform-notification-executor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-notification-executor
  template:
    metadata:
      annotations:
        notification.suncoast.systems/redeploy-reason: "internal-rate-limit-skip-20260804"
        reloader.stakater.com/auto: "true"
      labels:
        app: platform-notification-executor
    spec:
      serviceAccountName: platform-notification-executor
      containers:
        - name: vault-agent
          image: hashicorp/vault:1.15.4
          command: ["vault", "agent", "-config=/vault-config/vault-agent.hcl"]
          volumeMounts:
            - name: vault-agent-config
              mountPath: /vault-config
            - name: vault-secrets
              mountPath: /vault-secrets
        - name: platform-notification-executor
          image: "ghcr.io/dotcomrow/platform-notification-executor:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: EXECUTOR_MODE
              value: "provider"
            - name: AUTH_REQUIRED
              value: "true"
            - name: PLATFORM_NOTIFICATION_SERVICE_URL
              value: "http://platform-notification-service.directus.svc.cluster.local:8080"
            - name: INTERNAL_TOKEN_VAULT_PATH
              value: "secret/data/platform-notification-service"
            - name: INTERNAL_TOKEN_VAULT_KEY
              value: "token"
            - name: BROWSER_PUSH_VAPID_VAULT_PATH
              value: "secret/data/platform-notification/browser-push/vapid"
            - name: BROWSER_PUSH_VAPID_PUBLIC_KEY_VAULT_KEY
              value: "public_key"
            - name: BROWSER_PUSH_VAPID_PRIVATE_KEY_VAULT_KEY
              value: "private_key"
            - name: BROWSER_PUSH_VAPID_SUBJECT_VAULT_KEY
              value: "subject"
            - name: VAULT_ADDR
              value: "http://vault.vault.svc.cluster.local:8200"
            - name: VAULT_TOKEN_FILE
              value: "/vault-secrets/vault-token"
            - name: OPENAPI_SERVER_URL
              value: "http://platform-notification-executor.directus.svc.cluster.local:8080"
            - name: REQUEST_TIMEOUT_MS
              value: "15000"
            - name: RATE_MAX
              value: "120"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault-secrets
      volumes:
        - name: vault-agent-config
          configMap:
            name: vault-agent-config-platform-notification-executor
        - name: vault-secrets
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: platform-notification-executor
  namespace: directus
  labels:
    app: platform-notification-executor
spec:
  selector:
    app: platform-notification-executor
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
