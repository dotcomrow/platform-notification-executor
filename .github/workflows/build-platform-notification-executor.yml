name: Build and Push Platform Notification Executor

on:
  push:
    branches:
      - prod
    paths:
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "src/**"
      - ".github/workflows/build-platform-notification-executor.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: platform-notification-executor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: "Build and Push"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set immutable image tag
        id: set-tag
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/platform-notification-executor:${{ steps.set-tag.outputs.tag }} \
            -t ghcr.io/${{ github.repository_owner }}/platform-notification-executor:latest \
            .

      - name: Push Docker image to GHCR
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/platform-notification-executor:${{ steps.set-tag.outputs.tag }}
          docker push ghcr.io/${{ github.repository_owner }}/platform-notification-executor:latest

      - name: Record deployed image in manifest
        env:
          IMAGE_TAG: ${{ steps.set-tag.outputs.tag }}
        run: |
          sed -i -E "s#image: \"ghcr.io/dotcomrow/platform-notification-executor:[^\"]+\"#image: \"ghcr.io/dotcomrow/platform-notification-executor:${IMAGE_TAG}\"#" manifests/80-platform-notification-executor.yaml
          grep -Fq "image: \"ghcr.io/dotcomrow/platform-notification-executor:${IMAGE_TAG}\"" manifests/80-platform-notification-executor.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/80-platform-notification-executor.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Deploy platform notification executor ${IMAGE_TAG} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Remove local Docker image
        run: |
          docker rmi ghcr.io/${{ github.repository_owner }}/platform-notification-executor:${{ steps.set-tag.outputs.tag }} || true
          docker rmi ghcr.io/${{ github.repository_owner }}/platform-notification-executor:latest || true
          docker image prune -f
